[project]
name = "aura"
version = "0.1.0"
description = "Aura Python modules"
requires-python = ">=3.11"
dependencies = ["llm-client"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modules/llm-client"]

[tool.uv.sources]
llm-client = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["modules/llm-client/tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
